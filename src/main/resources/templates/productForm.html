<!DOCTYPE html>
<html lang="en">
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
          integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7/2l5u/zzAdt37hOhLq2gXt5MWdXftfQ+4" rel="stylesheet">

    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
    <link href="css/productform.css" rel="stylesheet">
    <title>Part Form</title>

    <!--    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />-->
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand" style="color: #d4af37">Precision Firearms</span>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a aria-current="page" class="nav-link" href="/mainscreen" id="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="'/about'">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<h1>Product Detail</h1>
<form action="#" method="POST" th:action="@{/showFormAddProduct}" th:object="${product}" }>
    <!-- Add hidden form field to handle update -->
    <p><input th:field="*{id}" type="hidden"/></p>

    <p><input class="form-control mb-4 col-4" placeholder="Name" required th:field="*{name}" type="text"/></p>

    <p><input class="form-control mb-4 col-4" placeholder="Price" th:field="*{price}" type="text"/></p>


    <p><input class="form-control mb-4 col-4" placeholder="Inventory" th:field="*{inv}" type="text"/></p>

    <p>
    <div class="errorMsg" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>

    <div class="errorMsg" th:if="${errorMessage}">
        <p th:text="${errorMessage}"></p>
    </div>
    </p>
    <p><input type="submit" value="Submit"/></p>
</form>


<table class="table table-bordered table-striped">
    <thead class="thead-dark">
    <h2>Available Parts</h2>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Inventory</th>
        <th>Action</th>
    </tr>
    </thead>
    <form>
        <tr th:each="tempPart : ${availparts}">
            <td style="color:#e0e0e0" th:text="${tempPart.name}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.price}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.inv}">1</td>
            <td><a class="btn btn-primary btn-sm mb-3" th:href="@{/associatepart(partID=${tempPart.id})}">Add</a>
            </td>
        </tr>
    </form>
</table>
<table class="table table-bordered table-striped">
    <h2>Associated Parts</h2>
    <thead class="thead-dark">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Inventory</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tempPart : ${assparts}">
        <td style="color:#e0e0e0" th:text="${tempPart.name}">1</td>
        <td style="color:#e0e0e0" th:text="${tempPart.price}">1</td>
        <td style="color:#e0e0e0" th:text="${tempPart.inv}">1</td>
        <td><a class="btn btn-primary btn-sm mb-3" th:href="@{/removepart(partID=${tempPart.id})}">Remove</a>
        </td>
    </tr>
    </tbody>
</table>


<!--<footer><a href="http://localhost:8080/">Link-->

</body>
</html>
