<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">

    <!-- Bootstrap CSS -->
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/mainscreen.css}">

    <title>Precision Firearms</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand" style="color: #d4af37">Precision Firearms</span>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a aria-current="page" class="nav-link" href="/mainscreen" id="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="'/about'">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <h1>PRECISION FIREARMS</h1>
    <img alt="bullseye" src="https://www.svgrepo.com/show/68180/shooting-target.svg">
    <hr>
    <h2>Accessories</h2>
    <form th:action="@{/mainscreen}">
        Filter: <input id="partkeyword" name="partkeyword" required size="50" th:value="${partkeyword}" type="text"/>
        &nbsp;
        <input type="submit" value="Search"/>
        &nbsp;
        <input id="btnClearPart" onclick="clearSearch()" type="button" value="Clear"/>
    </form>
    <br><br>
    <a class="btn btn-primary btn-sm mb-3" th:href="@{/showFormAddInPart}">Add Inhouse Part</a>
    <a class="btn btn-primary btn-sm mb-3" th:href="@{/showFormAddOutPart}">Add Outsourced Part</a>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Min Inventory</th>
            <th>Max Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempPart : ${parts}">
            <td style="color:#e0e0e0" th:text="${tempPart.name}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.price}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.inv}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.minInv}">1</td>
            <td style="color:#e0e0e0" th:text="${tempPart.maxInv}"></td>
            <td><a class="btn btn-primary btn-sm mb-3"
                   th:href="@{/showPartFormForUpdate(partID=${tempPart.id})}">Update</a>
                <a class="btn btn-primary btn-sm mb-3" onclick="if(!(confirm('Are you sure you want to delete this part?')))return false"
                   th:href="@{/deletepart(partID=${tempPart.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <h2>Rifles</h2>
    <form th:action="@{/mainscreen}">
        Filter: <input id="productkeyword" name="productkeyword" required size="50" th:value="${productkeyword}"
                       type="text"/>
        &nbsp;
        <input type="submit" value="Search"/>
        &nbsp;
        <input id="btnClearProduct" onclick="clearSearch()" type="button" value="Clear"/>
    </form>
    <script type="text/javascript">
        function clearSearch() {
            window.location = "[[@{/}]]";
        }
    </script>
    <br><br>
    <a class="btn btn-primary btn-sm mb-3" th:href="@{/showFormAddProduct}">Add Product</a>
    <table class="table table-bordered table-striped">
        <thead class="thead-dark">
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Inventory</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tempProduct : ${products}">
            <td style="color:#e0e0e0" th:text="${tempProduct.name}">1</td>
            <td style="color:#e0e0e0" th:text="${tempProduct.price}">1</td>
            <td style="color:#e0e0e0" th:text="${tempProduct.inv}">1</td>
            <td><a class="btn btn-primary btn-sm mb-3"
                   th:href="@{/showProductFormForUpdate(productID=${tempProduct.id})}">Update</a>
                <a class="btn btn-primary btn-sn mb-3" th:href="@{/buyNow(productID=${tempProduct.id})}">Buy Now</a>
                <a class="btn btn-primary btn-sm mb-3" onclick="if(!(confirm('Are you sure you want to delete this product?')))return false"
                   th:href="@{/deleteproduct(productID=${tempProduct.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
