<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Part Form</title>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type"/>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">

    <link href="css/updateprod.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand" style="color: #d4af37">Precision Firearms</span>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a aria-current="page" class="nav-link" href="/mainscreen" id="home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="'/about'">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<h1>Inhouse Part Details</h1>
<form action="#" method="POST" th:action="@{/showFormAddInPart}" th:object="${inhousepart}">

    <!-- Add hidden form field to handle update -->
    <p><input th:field="*{id}" type="hidden"/></p>

    <p><input class="form-control mb-4 col-4" placeholder="Name" required th:field="*{name}" type="text"/></p>

    <p><input class="form-control mb-4 col-4" placeholder="Price" th:field="*{price}" type="text"/></p>
    <!--<span th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price Error</span>-->

    <p><input class="form-control mb-4 col-4" placeholder="Inventory" required th:field="*{inv}" type="text"/></p>
    <!--    <span th:if="${#fields.hasErrors('inv')}" th:errors="*{inv}">Inventory Error</span>-->

    <p><input class="form-control mb-4 col-4" placeholder="Minimum Inventory" th:field="*{minInv}" type="text"/></p>
    <!--    <span th:if="${#fields.hasErrors('minInv')}" th:errors="*{minInv}">Minimum Inventory Error</span>-->

    <p><input class="form-control mb-4 col-4" placeholder="Maximum Inventory" th:field="*{maxInv}" type="text"></p>
    <!--    <span th:if="${#fields.hasErrors('maxInv')}" th:errors="*{maxInv}">Maximum Inventory Error</span>-->


    <p><input class="form-control mb-4 col-4" placeholder="Part ID" th:field="*{partId}" type="text"/></p>

    <div class="errorMsg" th:if="${#fields.hasGlobalErrors()}">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
    </div>
    <br>
    <p><input type="submit" value="Submit"/></p>
</form>
</body>
</html>
